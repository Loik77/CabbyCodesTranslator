name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore CabbyCodesTranslator/CabbyCodesTranslator.csproj
      - name: Publish
        run: dotnet publish CabbyCodesTranslator/CabbyCodesTranslator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CabbyCodesTranslator-win-x64
          path: publish/CabbyCodesTranslator.exe
